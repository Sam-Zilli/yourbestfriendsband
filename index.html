<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO & social sharing -->
    <meta name="description" content="Your Best Friends - Boston-based Indie Americana band. Authentic roots music from Massachusetts.">
    <meta name="keywords" content="Your Best Friends, Indie Americana, Boston band, roots music, Massachusetts">
    <meta property="og:title" content="Your Best Friends - Boston Indie Americana Band">
    <meta property="og:description" content="Boston-based Indie Americana band delivering authentic roots music.">
    <meta property="og:type" content="website">

    <title>Your Best Friends - Boston Indie Americana Band</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" as="image" href="assets/amp-final-1.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <script defer src="nav.js"></script>
  </head>
  <body>

    <!-- Fixed navbar — scrolls between sections via anchor links -->
    <nav class="navbar" aria-label="Main navigation">
      <div class="nav-container">
        <div class="nav-brand">
          <!-- Each letter wrapped in <span> for typewriter stagger effect (see style.css) -->
          <h1 class="typewriter-text"><span>Y</span><span>o</span><span>u</span><span>r</span><span> </span><span>B</span><span>e</span><span>s</span><span>t</span><span> </span><span>F</span><span>r</span><span>i</span><span>e</span><span>n</span><span>d</span><span>s</span></h1>
        </div>
        <ul class="nav-links">
          <li><a href="#contact">Contact</a></li>
          <li><a href="#music">Music</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </div>
    </nav>

    <!-- Each section is full-viewport with a background photo and scroll-snap -->
    <main>
      <section id="contact" class="hero-section hero-contact" role="img" aria-label="Band performing on stage">
        <div class="hero-content">
          <div class="section section-alt">
            <div class="container">
              <h2>Don't be a stranger.</h2>
              <div class="social-links">
                <a href="https://www.instagram.com/yourbestfriendsband/" class="social-link instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.youtube.com/@yourbestfriendsband" class="social-link youtube" target="_blank" rel="noopener noreferrer">Youtube</a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="music" class="hero-section hero-music" role="img" aria-label="Open field at golden hour">
        <p class="coming-soon">Coming Soon</p>
      </section>

      <section id="about" class="hero-section hero-about" role="img" aria-label="Band portrait outdoors">
        <div class="hero-content">
          <div class="section">
            <div class="container">
              <h2>About</h2>
              <p>Your Best Friends is a Boston-based indie Americana band that creates earnest music for earnest people — and those aspiring to be</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Year is updated dynamically by nav.js -->
    <footer>
      <div class="container">
        <p>&copy; <span id="current-year">2025</span> Your Best Friends. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
